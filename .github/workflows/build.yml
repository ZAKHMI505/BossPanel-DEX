name: Build Boss Panel DEX
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept SDK licenses and install Android packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Embed HTML and compile DEX
        run: |
          python3 scripts/embed_html.py
          mkdir -p build/classes build/dex
          javac -source 8 -target 8 -bootclasspath "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d build/classes src/com/bosspanel/dialog/BossPanelDialog.java
          jar cf build/bosspanel.jar -C build/classes .
          "$ANDROID_HOME/build-tools/35.0.0/d8" --release --min-api 21 \
            --lib "$ANDROID_HOME/platforms/android-35/android.jar" \
            --output build/dex build/bosspanel.jar
          cp build/dex/classes.dex classes2.dex
          test -s classes2.dex
          grep -q 'Lcom/bosspanel/dialog/BossPanelDialog;' 'HOOK .txt'
      - name: Verify DEX
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/dexdump" classes2.dex > dexdump.txt
          grep -q 'com.bosspanel.dialog.BossPanelDialog' dexdump.txt
          grep -q 'show' dexdump.txt
          grep -q 'dismissDialog' dexdump.txt
          grep -q 'exitApp' dexdump.txt
      - name: Package only DEX and HOOK
        run: |
          mkdir -p output
          cp classes2.dex "HOOK .txt" output/
          cd output
          zip -9 ../Boss_Panel_Dialog_HOOK.zip "classes2.dex" "HOOK .txt"
          cd ..
          unzip -l Boss_Panel_Dialog_HOOK.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Boss_Panel_Dialog_HOOK
          path: Boss_Panel_Dialog_HOOK.zip
          if-no-files-found: error
